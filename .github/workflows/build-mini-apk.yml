name: Build MINI Android APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'mini-android/**'
      - '.github/workflows/build-mini-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: mini-android
        run: gradle assembleDebug
      - name: Copy APK
        run: cp mini-android/app/build/outputs/apk/debug/app-debug.apk MINI-Pattern-Translator-v7.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MINI-Pattern-Translator-v7
          path: MINI-Pattern-Translator-v7.apk
