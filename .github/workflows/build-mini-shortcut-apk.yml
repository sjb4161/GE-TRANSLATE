name: Build MINI ChatGPT Shortcut APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'mini-chatgpt-shortcut/**'
      - '.github/workflows/build-mini-shortcut-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command line tools
        shell: bash
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmd
          mv /tmp/android-cmd/cmdline-tools "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: mini-chatgpt-shortcut
        run: gradle assembleDebug
      - name: Copy APK
        run: cp mini-chatgpt-shortcut/app/build/outputs/apk/debug/app-debug.apk MINI-Pattern-ChatGPT-Shortcut-v1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MINI-Pattern-ChatGPT-Shortcut-v1
          path: MINI-Pattern-ChatGPT-Shortcut-v1.apk
