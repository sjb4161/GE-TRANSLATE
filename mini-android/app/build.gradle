plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mini.patterntranslator'
    compileSdk 35

    defaultConfig {
        applicationId "com.mini.patterntranslator"
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName "7.0.0"
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
